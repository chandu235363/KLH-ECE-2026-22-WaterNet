services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: waternet
      POSTGRES_USER: waternet
      POSTGRES_PASSWORD: waternet
    ports:
      - "5432:5432"
    volumes:
      - waternet_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waternet"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://waternet:waternet@db:5432/waternet
      PORT: "8000"
      JWT_SECRET: waternet-super-secret-key-pbl-2026
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    command: >
      sh -c "node seed.js && node server.js"

  simulator:
    build: ./backend
    depends_on:
      - backend
    environment:
      API_BASE: http://backend:8000
      SIM_INTERVAL_SECONDS: "5"
    command: >
      sh -c "sleep 5 && node simulator.js"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  waternet_db_data:
